name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: actions
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:actions
